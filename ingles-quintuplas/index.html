<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: app de mensagens no celular. Cada irmã é um "contato" com uma cor; abas fixas embaixo. */
:root{
  --bg:#f6f3f8; --surface:#ffffff; --surface2:#efeaf3; --fg:#231c2b; --muted:#6c6278; --line:#e0d8e7;
  --ichika:#d68a1a; --nino:#d23f7a; --miku:#2f72c9; --yotsuba:#2d9a52; --itsuki:#c8502e;
  --accent:#7a3fb0; --ok:#2d9a52; --bad:#c8392e;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131c; --surface:#221c29; --surface2:#2c2534; --fg:#f1ebf6; --muted:#a99db6; --line:#3a3144;
  --ichika:#f0a93f; --nino:#f0679d; --miku:#6aa3ef; --yotsuba:#5cc47d; --itsuki:#ee7a55;
  --accent:#b07ce0; --ok:#5cc47d; --bad:#f07466; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131c; --surface:#221c29; --surface2:#2c2534; --fg:#f1ebf6; --muted:#a99db6; --line:#3a3144;
  --ichika:#f0a93f; --nino:#f0679d; --miku:#6aa3ef; --yotsuba:#5cc47d; --itsuki:#ee7a55;
  --accent:#b07ce0; --ok:#5cc47d; --bad:#f07466; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem;font-weight:900}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* mensagens */
.msg{display:flex;gap:10px;align-items:flex-start}
.ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;font-size:1rem}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 13px;min-width:0;display:flex;flex-direction:column;gap:4px}
.bubble .who{font-weight:700;font-size:.82rem}
.me{flex-direction:row-reverse}
.me .bubble{border-radius:16px 4px 16px 16px;background:var(--surface2)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%}
.slot{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2);border:0;text-align:left;width:100%}
.slot .time{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.slot .stripe{width:4px;align-self:stretch;border-radius:4px}
.slot div{min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--surface2)}
/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(7,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;color:var(--muted);font-weight:700}
nav.tabs button .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.75rem;color:#fff;opacity:.55}
nav.tabs button[aria-selected="true"]{color:var(--fg)}
nav.tabs button[aria-selected="true"] .d{opacity:1}
/* cartas */
.card{min-height:210px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;width:100%}
.card .word{font-family:var(--display);font-size:2rem;font-weight:900;overflow-wrap:anywhere}
.card .ex{font-style:italic}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* exercícios */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.feedback{padding:10px 12px;border-radius:12px;background:var(--surface2)}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 13px;font:inherit}
textarea{resize:vertical;min-height:48px}
.chat{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pick button{flex:none;border:2px solid transparent;border-radius:99px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:6px;background:var(--surface2);font-weight:700;font-size:.85rem}
.pick button .ava{width:26px;height:26px;font-size:.8rem}
.pick button[aria-pressed="true"]{border-color:var(--accent)}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.unit .n{font-family:var(--display);font-weight:900;width:28px;text-align:center;font-variant-numeric:tabular-nums}
.unit.done .n{color:var(--ok)}
.unit div{min-width:0}
.tr{color:var(--muted);font-size:.9rem}
.affs{display:flex;flex-direction:column;gap:10px}
.aff{display:flex;gap:10px;align-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--surface2);font-size:.75rem;font-weight:700;color:var(--muted);opacity:.6}
.badge.on{opacity:1;color:var(--fg)}
.badge .bi{font-size:1.5rem;line-height:1}
.vn-stage{--sc:var(--accent);position:relative;border-radius:20px;padding:14px;min-height:340px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 22%,var(--surface)) 0%,var(--surface) 70%)}
.vn-sprite{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.vn-box{background:color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid var(--line);border-radius:16px;padding:22px 14px 14px;position:relative}
.vn-name{position:absolute;top:-13px;left:14px;color:#fff;font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:99px}
.vn-text{font-size:1.12rem;line-height:1.7;margin:0}
.w{background:none;border:0;padding:0 1px;margin:0;font:inherit;color:inherit;border-bottom:1px dotted var(--muted);cursor:pointer}
.w:active{background:var(--surface2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface2)}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.fix{border-left:3px solid var(--nino);padding-left:10px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:.88rem;z-index:20;max-width:90vw;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function ensureS(){for(const [k,v] of [["aff",{}],["stats",null],["errors",[]],["ach",{}],["letters",[]],["custom",[]],["photos",{}],["cards",{}],["done",{}],["tests",[]]])if(S[k]==null)S[k]=v===null?null:JSON.parse(JSON.stringify(v));
  if(!S.stats){S.stats={};for(const d of Object.values(DAYS))for(const [a,n] of Object.entries(d.acts||{}))S.stats[a]=(S.stats[a]||0)+n;
    if(!Object.keys(S.aff).length){const map={aula:["itsuki",20],cartas:["miku",2],conversa:["yotsuba",3],onibus:["ichika",3],escrita:["nino",3]};for(const [a,n] of Object.entries(S.stats))if(map[a])S.aff[map[a][0]]=(S.aff[map[a][0]]||0)+n*map[a][1]}}}
let DAYS={}; // dkey -> {xp,min,acts}
let db=null, sample=null, assets=null, tab="inicio", mode="local";

const LS="quint-ingles-v1";

  {id:"cartas",act:"cartas",block:"tarde",s:"miku",tab:"cartas",title:"Cartas da Miku",need:15,unit:"cartas",hint:"vocabulário com áudio"},
  {id:"conversa",act:"conversa",block:"tarde",s:"yotsuba",tab:"conversa",title:"Conversa com a Yotsuba",need:8,unit:"mensagens",hint:"fale pelo 🎤 do teclado"},
  {id:"ditado",act:"onibus",block:"onibus",s:"ichika",tab:"ouvir",mode:"ditado",title:"Ditado da Ichika",need:10,unit:"frases",hint:"ouvir com fone e digitar"},
  {id:"escrita",act:"escrita",block:"onibus",s:"nino",tab:"escrita",title:"Escrita da Nino",need:6,unit:"frases",hint:"ler em português e escrever em inglês"}
];
const BLOCKS={tarde:{name:"Tarde",wk:"14:00–15:30",s:"itsuki"},onibus:{name:"Ônibus",wk:"17:57",s:"ichika"}};
function taskProg(t,k=dkey()){const a=((DAYS[k]||{}).acts||{})[t.act]||0;return Math.min(a,t.need)}
const taskDone=(t,k)=>taskProg(t,k)>=t.need;
const blockDone=(b,k)=>TASKS.filter(t=>t.block===b).every(t=>taskDone(t,k));
function daySummary(k){return {tarde:blockDone("tarde",k),onibus:blockDone("onibus",k),feitas:TASKS.filter(t=>taskDone(t,k)).length,total:TASKS.length}}
const isWeekend=(d=new Date())=>d.getDay()===0||d.getDay()===6;

const ACT_SIS={aula:"itsuki",cartas:"miku",onibus:"ichika",escrita:"nino",leitura:"nino",fala:"yotsuba",revisao:"itsuki",teste:"itsuki"};
function gain(xp,act,sis){
  ensureS();
  const k=dkey();const d=DAYS[k]||(DAYS[k]={xp:0,min:0,acts:{}});
  d.xp+=xp;d.acts[act]=(d.acts[act]||0)+1;S.xp+=xp;
  S.stats[act]=(S.stats[act]||0)+1;
  const s=sis||ACT_SIS[act];if(s)addAff(s,xp);
  checkAch();
  saveDay(k);saveState();
}
// tempo de estudo: conta minutos com a página visível e alguma interação no último minuto
let lastAct=Date.now();
["pointerdown","keydown"].forEach(e=>addEventListener(e,()=>lastAct=Date.now(),{passive:true}));
setInterval(()=>{if(document.visibilityState!=="visible"||Date.now()-lastAct>60000)return;const k=dkey();const d=DAYS[k]||(DAYS[k]={xp:0,min:0,acts:{}});d.min=(d.min||0)+1;saveDay(k)},60000);

function streak(){let n=0,k=dkey();if(!(DAYS[k]&&DAYS[k].xp>0))k=addDays(k,-1);while(DAYS[k]&&DAYS[k].xp>0){n++;k=addDays(k,-1)}return n}
function todayXP(){return (DAYS[dkey()]||{}).xp||0}
function nextTest(){const last=S.tests.length?S.tests[S.tests.length-1].date:null;return last?addDays(last,TEST_EVERY):dkey()}

let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/female|samantha|google/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function speak(t,rate=0.9){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=Math.min(2,rate*((typeof VOICE_PREF!=="undefined"&&VOICE_PREF.rate)||1));const pv=typeof VOICE_PREF!=="undefined"&&VOICE_PREF.name&&speechSynthesis.getVoices().find(v=>v.name===VOICE_PREF.name);if(pv)u.voice=pv;else if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){toast("Seu navegador não tem voz em inglês")}}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function homeMessage(){
  const st=streak(),now=new Date(),m=now.getHours()*60+now.getMinutes(),k=dkey(),we=isWeekend(now);
  const sm=daySummary(k),tarde=sm.tarde,onibus=sm.onibus;
  if(!S.tests.length) return ["itsuki","Antes de começar, faça o <b>teste de nível</b>. São 15 perguntas, uns 8 minutos. Assim eu sei por onde começar com você."];
  if(tarde&&onibus) return ["yotsuba",`Todas as tarefas de hoje feitas! ${st>1?`Já são <b>${st} dias seguidos</b>!`:""} Você está cada vez mais perto de jogar a sua rota. 🍀`];
  if(m>=21*60) return ["nino",`Ei! Já são ${now.getHours()}h e faltam <b>${sm.total-sm.feitas} tarefas</b>. Não é como se eu me importasse… mas termina agora!`];
  if(we){
    if(!tarde) return ["itsuki","Fim de semana não tem horário fixo, mas as tarefas continuam. Comece pelo <b>bloco da tarde</b>: aula, cartas e conversa."];
    return ["ichika","Bloco da tarde feito. Agora só falta escutar e escrever comigo e com a Nino. Pode ser a qualquer hora."];
  }
  if(m>=17*60+57&&!onibus) return ["ichika","Hora do ônibus, tutor. Fone no ouvido: <b>ditado</b> comigo e depois <b>escrita</b> com a Nino."];
  if(m>=14*60&&m<15*60+30&&!tarde) return ["itsuki","Está no horário de estudo (14:00–15:30). Faça as tarefas da tarde em ordem: <b>aula</b>, <b>cartas</b> e <b>conversa</b>."];
  if(m>=15*60+30&&!tarde) return ["nino","O horário da tarde passou e ainda tem tarefa aberta. Termina antes do ônibus, hein!"];
  if(tarde) return ["miku","A tarde está feita… às 17:57 a Ichika te espera no ônibus."];
  return ["ichika","Hoje às 14:00 começa o estudo da tarde, e às 17:57 tem escuta e escrita no ônibus. Combinado?"];
}

/* ---------- AULA ---------- */
let lesson=null,lessonIdx=null,lessonPos=0,lessonScore=0;
function vAula(){
  if(lesson) return vLesson();
  const next=UNITS.findIndex((u,i)=>!S.done[i]);
  $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
    ${msg("itsuki",`<p>Cada aula tem uma explicação curta em português, exemplos com áudio e 5 exercícios. Se acertar 4 ou mais, a aula conta como concluída.</p>`)}
    <section class="panel"><h2>Trilha A1 → A2</h2><div class="units">
    ${UNITS.map((u,i)=>`<button class="unit ${S.done[i]?"done":""}" data-unit="${i}"><span class="n">${S.done[i]?"✓":i+1}</span><div><b>${esc(u.t)}</b><div class="small muted">com ${SIS[u.s].name}${i===next?" · próxima":""}</div></div></button>`).join("")}
    </div></section></div>`;
  document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>startLesson(+b.dataset.unit));
}
async function startLesson(i){
  lessonIdx=i;lessonPos=-1;lessonScore=0;const u=UNITS[i];
  $("#view").innerHTML=`<div class="panel">${msg(u.s,`<p><span class="spin"></span> Preparando a aula “${esc(u.t)}”…</p>`)}</div>`;
  if(!sample){ if(i===0){lesson=LESSON1;return vLesson()} $("#view").innerHTML=`<div class="panel">${msg("itsuki","<p>As aulas novas são montadas pela IA, que não está disponível agora. A Aula 1 funciona sem ela. Abra pelo app do Claude, logado na sua conta.</p>")}<button class="btn ghost" id="back">Voltar</button></div>`;$("#back").onclick=()=>{lesson=null;vAula()};return}
  const lvl=S.tests.length?S.tests[S.tests.length-1].level:"iniciante (lê um pouco, entende pouco ouvindo, fala pouco)";
  const prompt=`Você é ${SIS[u.s].name}, uma das quíntuplas Nakano, dando aula de inglês para um aluno brasileiro adolescente. Personalidade: ${SIS[u.s].vibe}. Nível do aluno: ${lvl}. Ele quer jogar uma visual novel do anime em inglês.
Monte a aula "${u.t}" com foco em: ${u.f}.
Responda SOMENTE com JSON neste formato:
{"title":string,"intro":string (explicação em português, 3 a 5 frases simples, no jeito de falar da personagem),"examples":[{"en":string,"pt":string}] (4 a 5 exemplos curtos com cenas de escola, irmãs, provas, festivais),"exercises":[{"q":string,"options":[string,string,string],"answer":número 0-2,"explain":string em português curto}] (exatamente 5, variando: completar, tradução, escolher a frase correta)}`;
  try{
    const r=await sample.json(prompt,{modelTier:"default"});
    if(!r||!Array.isArray(r.exercises)||!r.exercises.length) throw new Error("formato");
    lesson={title:r.title||u.t,teacher:u.s,intro:r.intro||"",examples:(r.examples||[]).slice(0,6),exercises:r.exercises.slice(0,5).map(e=>({q:e.q,options:e.options,answer:Number(e.answer)||0,explain:e.explain||""}))};
    vLesson();
  }catch(e){
    const code=e&&e.code;
    if(i===0){lesson=LESSON1;return vLesson()}
    $("#view").innerHTML=`<div class="panel">${msg("itsuki",`<p>${code==="rate_limited"?"Muitas aulas em pouco tempo. Espere alguns minutos e tente de novo.":code==="not_granted"?"A IA não foi liberada nesta página. Toque em tentar de novo e permita o acesso.":"Não consegui montar a aula agora. Tente de novo."}</p>`)}<div class="row"><button class="btn" id="retry">Tentar de novo</button><button class="btn ghost" id="back">Voltar</button></div></div>`;
    $("#retry").onclick=()=>startLesson(i);$("#back").onclick=()=>{lesson=null;vAula()};
  }
}
function vLesson(){
  const L=lesson,t=L.teacher||"itsuki";
  if(lessonPos===-1){
    $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
      <div class="row"><button class="btn line" id="back">← Trilha</button><span class="eyebrow">Aula ${lessonIdx+1}</span></div>
      <h2>${esc(L.title)}</h2>
      ${msg(t,`<p>${esc(L.intro)}</p>`)}
      <section class="panel"><h3>Exemplos</h3>
      ${L.examples.map((x,i)=>`<button class="opt" data-say="${i}"><b>🔊 ${esc(x.en)}</b><div class="tr">${esc(x.pt)}</div></button>`).join("")}
      </section>
      <button class="btn full" id="startEx">Começar exercícios (${L.exercises.length})</button></div>`;

/* ---------- CARTAS (repetição espaçada) ---------- */
const BOX_DAYS=[0,1,3,7,14,30];
function dueCards(){
  const k=dkey(),seen=[],fresh=[];
  for(const c of allCards()){const st=S.cards[c.id];if(st){if(st.due<=k)seen.push(c)}else if(c.cat==="leitura")fresh.unshift(c);else fresh.push(c)}
  const newToday=Object.values(S.cards).filter(s=>s.first===k).length;
  return seen.concat(fresh.slice(0,Math.max(0,15-newToday)));
}
let cq=null,flip=false;
function vCartas(){
  if(!cq) cq=shuffle(dueCards());
  const learned=Object.values(S.cards).filter(s=>s.box>=3).length;
  const learning=Object.values(S.cards).filter(s=>s.box>=1&&s.box<3).length;
  const okToday=Object.values(S.cards).filter(s=>(s.last||s.first)===dkey()&&s.box>=1).length;
  if(!cq.length){
    $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">${msg("miku",`<p>Acabaram as cartas de hoje… Você acertou <b>${okToday}</b> palavras hoje.</p><p>🌱 <b>${learning}</b> aprendendo · 🌸 <b>${learned}</b> dominadas</p><p class="small muted">Uma palavra fica dominada quando você acerta ela em 3 revisões, em dias diferentes. Amanhã elas voltam para você confirmar…</p>`)}<button class="btn ghost" id="more">Treinar mais 5 palavras novas</button></div>`;
    $("#more").onclick=()=>{cq=shuffle(allCards().filter(c=>!S.cards[c.id])).slice(0,5);vCartas()};return;
  }
  const c=cq[0];
  $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">${cq.length} restantes · ${esc(c.cat)}</span><span class="chip">🌱 ${learning} · 🌸 ${learned}</span></div>
    <button class="card" id="card" aria-label="Virar carta">
      <span class="word">${esc(c.en)}</span>
      ${flip?`<span style="font-size:1.15rem;font-weight:700">${esc(c.pt)}</span><span class="ex">${esc(c.ex)}</span>`:`<span class="muted small">Toque para ver o significado</span>`}
    </button>
    <div class="row"><button class="btn ghost" id="say">🔊 Ouvir</button>${flip?`<button class="btn ghost" id="sayex">🔊 Ouvir a frase</button>`:""}</div>
    ${flip?`<div class="grade"><button class="btn" style="background:var(--bad)" data-g="0">Errei</button><button class="btn" style="background:var(--ichika)" data-g="1">Difícil</button><button class="btn" style="background:var(--ok)" data-g="2">Acertei</button></div>`:""}
  </div>`;
  $("#card").onclick=()=>{flip=!flip;if(flip)speak(c.en);vCartas()};
  $("#say").onclick=()=>speak(c.en);
  if(flip){$("#sayex").onclick=()=>speak(c.ex);
    document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const g=+b.dataset.g,k=dkey();const st=S.cards[c.id]||{box:0,first:k};
      st.box=g===0?0:g===1?Math.max(1,st.box):Math.min(BOX_DAYS.length-1,st.box+1);
      st.due=addDays(k,g===0?0:BOX_DAYS[st.box]);st.last=k;S.cards[c.id]=st;
      cq.shift();if(g===0)cq.push(c);flip=false;gain(2,"cartas");vCartas();
    });}
}

function chatHtml(m){
  if(m.role==="user") return `<div class="msg me"><div class="bubble"><p>${esc(m.text)}</p></div></div>`;
  if(m.pending) return msg(chatWho,`<p><span class="spin"></span> digitando…</p>`);
  return msg(chatWho,`<p>${esc(m.reply)}</p>${m.translation?`<p class="tr">${esc(m.translation)}</p>`:""}${m.correction?`<p class="fix">✏️ ${esc(m.correction)}</p>`:""}${m.model?`<p class="fix" style="border-color:var(--yotsuba)">💬 Você pode dizer: <b>${esc(m.model)}</b></p>`:""}<div class="row"><button class="btn line" style="padding:4px 10px;font-size:.8rem" data-speak="${esc(m.reply)}">🔊 Ouvir</button></div>`);
}
async function sendChat(text,isHelp){
  if(!text||chatBusy||!sample)return;
  chat.push(isHelp?{role:"user",text:"🤔 Não sei responder"}:{role:"user",text});
  chat.push({role:"assistant",pending:true});chatBusy=true;vConversa();
  const sys=`Você é ${SIS[chatWho].name} Nakano, de The Quintessential Quintuplets. Personalidade: ${SIS[chatWho].vibe}. Você conversa em inglês com um aluno brasileiro iniciante (lê melhor do que escuta e fala) para ele praticar. Regras: responda em inglês MUITO simples, 1 a 2 frases curtas, e termine com uma pergunta fácil para ele continuar. Não fale de conteúdo adulto. Se a mensagem dele tiver erro de inglês ou palavras em português, mostre a forma correta em "correction" (em português, curto e gentil, citando a frase certa em inglês); se estiver certa, deixe "correction" vazio. Se ele pedir ajuda, dê em "model" uma resposta modelo simples. Responda SOMENTE com JSON: {"reply":string,"translation":string (tradução da sua reply para português),"correction":string,"corrected":string (a mensagem do aluno reescrita em inglês correto; vazio se já estiver certa),"model":string}`;
  const hist=chat.filter(m=>!m.pending).slice(-12);
  const msgs=[{role:"user",content:sys+"\n\nComece a conversa."}];
  for(const m of hist){if(m.role==="assistant")msgs.push({role:"assistant",content:JSON.stringify({reply:m.reply})});else msgs.push({role:"user",content:m.text==="🤔 Não sei responder"?text:m.text})}
  if(msgs[msgs.length-1].role!=="user")msgs.push({role:"user",content:text});
  try{
    const r=await sample.json(msgs,{modelTier:"quick",cache:false});
    chat.pop();chat.push({role:"assistant",reply:String(r.reply||"…"),translation:String(r.translation||""),correction:String(r.correction||""),model:String(r.model||"")});
    ensureS();if(!isHelp){if(r.correction){S.stats.convRun=0;addError({src:"conversa",wrong:text,right:String(r.corrected||"").trim(),note:String(r.correction)})}else{S.stats.convRun=(S.stats.convRun||0)+1;S.stats.convBest=Math.max(S.stats.convBest||0,S.stats.convRun)}}
    gain(3,"conversa",chatWho);
  }catch(e){chat.pop();chat.push({role:"assistant",reply:"(…)",translation:e&&e.code==="rate_limited"?"Muitas mensagens seguidas. Espere um pouco e tente de novo.":"Não consegui responder agora. Tente enviar de novo.",correction:""})}
  chatBusy=false;vConversa();if(!isHelp){const ta=$("#say");if(ta)ta.value=""}
}

const AFF_T=[0,40,120,250,450,700,1000,1400,1900,2500];
const affLevel=p=>AFF_T.filter(t=>p>=t).length;
function affInfo(s){const p=Math.round((S.aff||{})[s]||0),l=affLevel(p);const a=AFF_T[l-1],b=AFF_T[l];return {p,l,pct:b==null?100:Math.round((p-a)/(b-a)*100),next:b}}
const LETTER_FB={
  ichika:l=>`Nível ${l}, hein? Você está ficando bom nisso… Keep going, I'm watching you~`,
  nino:l=>`Hmph. Nível ${l}. Não é como se eu estivesse feliz… Tá, talvez um pouquinho. Don't stop now!`,

function addAff(s,pts){

    </section></div>`;

  <p class="small muted">São as vozes instaladas no seu celular. No iPhone dá para baixar vozes melhores em Ajustes › Acessibilidade › Conteúdo Falado › Vozes › Inglês (procure as "Aprimorada" ou "Premium").</p>
  ${vs.length?`<label for="vsel" class="small muted">Voz</label><select id="vsel" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit"><option value="">Automática</option>${vs.map(v=>`<option value="${esc(v.name)}" ${v.name===VOICE_PREF.name?"selected":""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select>`:`<p class="small muted">Nenhuma voz em inglês encontrada neste aparelho.</p>`}
  <label for="vrate" class="small muted">Velocidade: <b id="vrl">${Math.round(VOICE_PREF.rate*100)}%</b></label><input type="range" id="vrate" min="0.6" max="1.3" step="0.05" value="${VOICE_PREF.rate}">
  <button class="btn ghost" id="vtest">🔊 Testar: "Hi! Let's study English together."</button></section>`}
function bindVoice(){const s=$("#vsel"),r=$("#vrate");const save=()=>{try{localStorage.setItem("quint-voz",JSON.stringify(VOICE_PREF))}catch(e){}};
  if(s)s.onchange=()=>{VOICE_PREF.name=s.value;save()};if(r)r.oninput=()=>{VOICE_PREF.rate=+r.value;$("#vrl").textContent=Math.round(VOICE_PREF.rate*100)+"%";save()};
  $("#vtest").onclick=()=>speak("Hi! Let's study English together.")}

/* ---------- TESTE ---------- */
let testState=null;
function vTeste(){
  if(!testState) testState={i:-1,score:0};
  const T=testState;
  if(T.i===-1){
    $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px"><button class="btn line" data-tab="inicio" style="align-self:flex-start">← Início</button>${msg("itsuki",`<p>Teste de nível: 15 perguntas de vocabulário, gramática, leitura e escuta. Não use tradutor, tá? O objetivo é ver onde você está de verdade. A cada ${TEST_EVERY} dias a gente refaz para medir a evolução.</p>`)}<button class="btn full" id="tgo">Começar</button></div>`;
    $("#tgo").onclick=()=>{T.i=0;vTeste()};return;
  }
  if(T.i>=TEST.length){
    const s=T.score,level=s<=5?"Iniciante":s<=10?"A1":s<=13?"A2":"A2+";
    if(!T.saved){T.saved=true;S.tests.push({date:dkey(),score:s,level});gain(50,"teste")}
    const prev=S.tests.length>1?S.tests[S.tests.length-2]:null;
    $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">${msg("itsuki",`<p>Resultado: <b>${s}/15</b>. Nível: <b>${level}</b>.${prev?` No teste anterior foram ${prev.score}/15.`:""} Próximo teste em ${TEST_EVERY} dias.</p>`)}${msg("nino",`<p>${s>=11?"Hmph… nada mal. Mas não fique convencido.":"Tá, agora você sabe onde está. Sem desculpas: aula todo dia."}</p>`)}<button class="btn full" data-tab="inicio">Voltar ao início</button></div>`;
    return;
  }
  const q=TEST[T.i];
  $("#view").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Pergunta ${T.i+1} de ${TEST.length}</span></div>
    <div class="bar"><span style="width:${T.i/TEST.length*100}%"></span></div>
    <section class="panel"><h3>${esc(q.q)}</h3>${q.listen?`<div class="row"><button class="btn ghost" id="tl">🔊 Ouvir</button><button class="btn line" id="tl2">🐢 Devagar</button></div>`:""}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-t="${i}">${esc(o)}</button>`).join("")}</div></section></div>`;
  if(q.listen){$("#tl").onclick=()=>speak(q.listen);$("#tl2").onclick=()=>speak(q.listen,0.6)}
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{if(+b.dataset.t===q.a)T.score++;T.i++;vTeste()});
}

/* ======================= INÍCIO ======================= */
function start(){
  $("#today").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  const h=(location.hash||"").slice(1);if(TABS.some(t=>t.id===h))tab=h;
  renderTabs();render();
}
lsLoad();ensureS();start();
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==tab&&(TABS.some(t=>t.id===h)||["teste","revisao","mensagens"].includes(h)))go(h)});

(async()=>{
  if(!window.claude||!claude.use)return;
  claude.use("sample").then(s=>{sample=s;if(tab==="conversa")render()});
  claude.use("assets").then(a=>{assets=a;if(tab==="inicio")render()});
  const d=await claude.use("db");if(!d)return;
  const timer=setTimeout(()=>{},10000);
  try{
    const st=await d.doc("estado/main").get();
    const ds=await d.collection("dias").get();
    clearTimeout(timer);
    db=d;mode="db";
    if(st.exists){S=Object.assign({},S,JSON.parse(JSON.stringify(st.data())));ensureS();renderTabs()}
    else{saveState()} // primeira vez: sobe o que estiver no aparelho
    const remote={};ds.docs.forEach(x=>{const v=x.data();if(v)remote[x.id]=JSON.parse(JSON.stringify(v))});
    for(const k in DAYS){if(!remote[k]||(remote[k].xp||0)<(DAYS[k].xp||0)){remote[k]=DAYS[k];saveDay(k)}}
    DAYS=remote;ensureS();lsSave();
    if(!lesson&&!vn&&!rv&&!(tab==="teste"&&testState&&testState.i>=0)&&!(tab==="conversa"&&(chat.length>1||sh)))render();
  }catch(e){clearTimeout(timer);console.warn("db",e)}
})();
</script>
